<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>史诗级寻宝游戏</title>
    <style>
        /* --- 4. 设计动画页面展示寻宝过程 --- */
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 90%;
            max-width: 700px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(15, 52, 96, 0.8);
            padding: 30px;
            position: relative;
            z-index: 10;
        }

        h1 {
            text-align: center;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            margin-top: 0;
        }

        /* 文本日志区域 */
        #log-area {
            height: 250px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #e94560;
            font-size: 16px;
            line-height: 1.6;
        }

        #log-area p {
            margin: 5px 0;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.5s forwards;
        }
        
        .error-text { color: #ff4d4d; }
        .success-text { color: #4dff88; font-weight: bold; font-size: 18px;}
        .action-text { color: #4dc3ff; }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* 按钮 */
        button {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #e94560;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 2px;
        }

        button:hover:not(:disabled) {
            background: #ff5e7e;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.7);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            color: #999;
        }

        /* 宝箱动画区域 */
        #treasure-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 100px;
            opacity: 0;
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 20;
        }

        #treasure-box.show {
            transform: translate(-50%, -50%) scale(1.5);
            opacity: 1;
        }

        /* 屏幕震动效果 */
        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🗺️ 史诗寻宝之旅</h1>
        <div id="log-area">
            <p>系统准备就绪，等待探险者出发...</p>
        </div>
        <button id="start-btn" onclick="startGame()">开始寻宝</button>
    </div>

    <!-- 宝箱动画元素 -->
    <div id="treasure-box">💎</div>

    <script>
        // --- 2. 增加新的有趣的寻宝情节 (修改TreasureMap) ---
        class TreasureMap {
            static getInitialClue() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve("在古老的图书馆里找到了一本落满灰尘的日记...");
                    }, 1000);
                });
            }

            static decodeAncientScript(clue) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (!clue) {
                            reject("没有线索可以解码!");
                        }
                        // 新增情节：加入解密失败的随机概率
                        if (Math.random() < 0.2) {
                            reject("日记上的文字太模糊了，解码失败！");
                        }
                        resolve("解码成功!日记上写着：宝藏沉睡在失落的远古神庙中...");
                    }, 1500);
                });
            }

            static searchTemple(location) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const random = Math.random();
                        if (random < 0.5) {
                            reject("糟糕!触发了神庙机关，遇到了巨型守卫!");
                        }
                        resolve("经过一番苦战，你在祭坛上发现了一个神秘的宝箱...");
                    }, 2000);
                });
            }

            static openTreasureBox() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve("恭喜!光芒四射，你找到了传说中的【无尽财富】和【古代神器】!");
                    }, 1000);
                });
            }
        }

        // 获取DOM元素
        const logArea = document.getElementById('log-area');
        const startBtn = document.getElementById('start-btn');
        const treasureBox = document.getElementById('treasure-box');

        // 辅助函数：添加带格式的日志
        function addLog(text, type = 'normal') {
            const p = document.createElement('p');
            p.textContent = text;
            if (type === 'error') p.classList.add('error-text');
            if (type === 'success') p.classList.add('success-text');
            if (type === 'action') p.classList.add('action-text');
            
            logArea.appendChild(p);
            logArea.scrollTop = logArea.scrollHeight;
        }

        // --- 3. 使用async/await重写寻宝过程 ---
        async function findTreasureAsync() {
            try {
                // 步骤1
                const clue = await TreasureMap.getInitialClue();
                addLog(clue, 'action');

                // 步骤2
                const location = await TreasureMap.decodeAncientScript(clue);
                addLog(location, 'action');

                // 步骤3
                const box = await TreasureMap.searchTemple(location);
                addLog(box, 'action');

                // 步骤4
                const treasure = await TreasureMap.openTreasureBox();
                addLog(treasure, 'success');
                
                // 触发宝箱动画
                treasureBox.classList.add('show');

            } catch (error) {
                // 捕获任何一步抛出的reject
                addLog(`任务失败: ${error}`, 'error');
                // 触发屏幕震动
                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 500);
            }
        }

        // 启动游戏的控制函数
        async function startGame() {
            startBtn.disabled = true;
            startBtn.textContent = "寻宝中...";
            logArea.innerHTML = ''; // 清空日志
            treasureBox.classList.remove('show'); // 隐藏宝箱
            
            await findTreasureAsync(); // 等待异步寻宝结束
            
            startBtn.disabled = false;
            startBtn.textContent = "重新寻宝";
        }
    </script>
</body>
</html>
